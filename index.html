<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentee-Mentor-Admin Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 50px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h1 {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .role-card {
            text-align: center;
            padding: 30px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #ddd;
        }
        
        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }
        
        .role-card i {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .role-card.mentee {
            background: linear-gradient(135deg, #667eea 0%, #667eea 100%);
            color: white;
        }
        
        .role-card.mentor {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .role-card.admin {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .role-card h3 {
            font-weight: 700;
            margin: 15px 0;
        }
        
        .role-card p {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .login-container {
                padding: 30px;
            }
            
            .role-card {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-graduation-cap me-3" style="color: #667eea;"></i>Mentor Admin Platform</h1>
            <p>Select your role to continue</p>
        </div>
        
        <div class="row g-4">
            <div class="col-md-4">
                <div class="role-card mentee" onclick="goToRole('mentee')">
                    <i class="fas fa-user"></i>
                    <h3>Mentee</h3>
                    <p>Submit queries and get guidance from experienced mentors</p>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="role-card mentor" onclick="goToRole('mentor')">
                    <i class="fas fa-chalkboard-user"></i>
                    <h3>Mentor</h3>
                    <p>Help mentees by providing solutions and guidance</p>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="role-card admin" onclick="goToRole('admin')">
                    <i class="fas fa-shield-alt"></i>
                    <h3>Admin</h3>
                    <p>Manage queries, mentors, and track analytics</p>
                </div>
            </div>
        </div>
        
        <!-- Modal for credentials -->
        <div class="modal fade" id="credentialModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalTitle"></h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="credentialForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Name</label>
                                <input type="text" class="form-control" id="username" placeholder="Enter your name" required>
                            </div>
                            <div class="mb-3" id="employeeIdField" style="display: none;">
                                <label for="employeeId" class="form-label">Employee ID</label>
                                <input type="text" class="form-control" id="employeeId" placeholder="Enter your employee ID">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Continue</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goToRole(role) {
            const modalTitle = document.getElementById('modalTitle');
            const employeeIdField = document.getElementById('employeeIdField');
            
            if (role === 'mentee') {
                modalTitle.textContent = 'Mentee Login';
                employeeIdField.style.display = 'block';
            } else if (role === 'mentor') {
                modalTitle.textContent = 'Mentor Login';
                employeeIdField.style.display = 'none';
            } else if (role === 'admin') {
                modalTitle.textContent = 'Admin Login';
                employeeIdField.style.display = 'none';
            }
            
            // Store role in form data
            document.getElementById('credentialForm').dataset.role = role;
            
            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('credentialModal'));
            modal.show();
        }
        
        document.getElementById('credentialForm').addEventListener('submit', function (e) {
            e.preventDefault();
            
            const role = this.dataset.role;
            const username = document.getElementById('username').value;
            const employeeId = document.getElementById('employeeId').value || '';
            
            // Store credentials
            if (role === 'mentee') {
                localStorage.setItem('userName', username);
                localStorage.setItem('employeeId', employeeId);
                window.location.href = '/mentee.html';
            } else if (role === 'mentor') {
                localStorage.setItem('mentorName', username);
                window.location.href = '/mentor.html';
            } else if (role === 'admin') {
                localStorage.setItem('adminName', username);
                window.location.href = '/admin.html';
            }
        });
    </script>
</body>
</html>
